<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="275" viewBox="0 0 1200 275" role="img" aria-label="Research roadmap: the real robot is on phase 1 of 12 (talking to hardware); the simulation twin has finished phase 4 (parity) and is moving to SLAM and Nav2.">
<rect x="0.5" y="0.5" width="1199" height="274" rx="16" fill="#060c1a" stroke="#1d3350"/>
<text x="48" y="75" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#2fd8b0" letter-spacing="1.2">REAL ROBOT</text><text x="48" y="97" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#8ea6b8">Autonomous-Mapping-and-Navigation</text><line x1="345" y1="70" x2="1120" y2="70" stroke="#1d3350" stroke-width="3" stroke-linecap="round"/><line x1="345" y1="70" x2="410" y2="70" stroke="#2fd8b0" stroke-width="3" stroke-linecap="round"/><circle cx="345.0" cy="70" r="7" fill="#2fd8b0"/><text x="345.0" y="100" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#eaf7f4" fill-opacity="0.9">Setup</text><circle cx="409.6" cy="70" r="7" fill="#060c1a" stroke="#2fd8b0" stroke-width="2.5"/><circle cx="409.6" cy="70" r="7" fill="none" stroke="#2fd8b0" stroke-width="2"><animate attributeName="r" values="7;16" dur="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.8;0" dur="1.8s" repeatCount="indefinite"/></circle><text x="409.6" y="100" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#2fd8b0" fill-opacity="1">Hardware</text><circle cx="474.2" cy="70" r="6" fill="#060c1a" stroke="#1d3350" stroke-width="2"/><text x="474.2" y="100" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#8ea6b8" fill-opacity="0.75">ROS 2</text><circle cx="538.8" cy="70" r="6" fill="#060c1a" stroke="#1d3350" stroke-width="2"/><text x="538.8" y="100" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#8ea6b8" fill-opacity="0.75">Odometry</text><circle cx="603.3" cy="70" r="6" fill="#060c1a" stroke="#1d3350" stroke-width="2"/><text x="603.3" y="100" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#8ea6b8" fill-opacity="0.75">Mapping</text><circle cx="667.9" cy="70" r="6" fill="#060c1a" stroke="#1d3350" stroke-width="2"/><text x="667.9" y="100" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#8ea6b8" fill-opacity="0.75">Scan match</text><circle cx="732.5" cy="70" r="6" fill="#060c1a" stroke="#1d3350" stroke-width="2"/><text x="732.5" y="100" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#8ea6b8" fill-opacity="0.75">SLAM</text><circle cx="797.1" cy="70" r="6" fill="#060c1a" stroke="#1d3350" stroke-width="2"/><text x="797.1" y="100" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#8ea6b8" fill-opacity="0.75">Benchmark</text><circle cx="861.7" cy="70" r="6" fill="#060c1a" stroke="#1d3350" stroke-width="2"/><text x="861.7" y="100" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#8ea6b8" fill-opacity="0.75">Localize</text><circle cx="926.2" cy="70" r="6" fill="#060c1a" stroke="#1d3350" stroke-width="2"/><text x="926.2" y="100" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#8ea6b8" fill-opacity="0.75">Plan</text><circle cx="990.8" cy="70" r="6" fill="#060c1a" stroke="#1d3350" stroke-width="2"/><text x="990.8" y="100" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#8ea6b8" fill-opacity="0.75">Follow</text><circle cx="1055.4" cy="70" r="6" fill="#060c1a" stroke="#1d3350" stroke-width="2"/><text x="1055.4" y="100" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#8ea6