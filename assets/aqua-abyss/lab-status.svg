7f4" fill-opacity="0.9">Parity</text><circle cx="1120.0" cy="175" r="7" fill="#060c1a" stroke="#7fe7dc" stroke-width="2.5"/><circle cx="1120.0" cy="175" r="7" fill="none" stroke="#7fe7dc" stroke-width="2"><animate attributeName="r" values="7;16" dur="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.8;0" dur="1.8s" repeatCount="indefinite"/></circle><text x="1120.0" y="205" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#7fe7dc" fill-opacity="1">SLAM + Nav2</text>
