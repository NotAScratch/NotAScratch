<text x="32" y="92" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#eaf7f4">AQI Monitor</text>
<text x="32" y="132" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.5" fill="#8ea6b8">An ESP32 reads an optical dust sensor, estimates PM2.5 and</text><text x="32" y="155" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.5" fill="#8ea6b8">AQI (US EPA or India CPCB), scrolls it on a P10 LED panel</text><text x="32" y="178" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.5" fill="#8ea6b8">and streams it to ThingsBoard.</text>
