<clipPath id="c"><rect width="600" height="300" rx="16"/></clipPath></defs>
<g clip-path="url(#c)"><rect width="600" height="300" fill="url(#g)"/><rect width="600" height="4" fill="#ff8fb3"/></g>
<rect x="0.5" y="0.5" width="599" height="299" rx="16" fill="none" stroke="#1d3350"/>
