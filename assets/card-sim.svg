<text x="32" y="132" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.5" fill="#666a75">A Gazebo twin of an Ackermann robot that uses the real</text><text x="32" y="155" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.5" fill="#666a75">robot's topics, frames and TF tree, so the real</text><text x="32" y="178" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.5" fill="#666a75">localization stack runs against it unchanged.</text>
